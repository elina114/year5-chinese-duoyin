<!doctype html>
<!-- FINAL VERSION: two buttons + Google Sheet submission + targeted wrong-answer explanations, 2026-09-02 -->
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>五年级华文多音多义字练习</title>
  <style>
    :root {
      --navy:#153b68; --ink:#16263b; --muted:#617389; --line:#d7e2ec;
      --teal:#19a5b4; --teal-soft:#e5f7f9; --orange:#ef9c2e;
      --green:#23865f; --green-soft:#e7f7f0; --red:#bd4343; --red-soft:#fff0f0;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0; color:var(--ink); font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;
      background:radial-gradient(circle at 10% 3%,rgba(25,165,180,.13),transparent 26rem),#f3f7fb;
    }
    button,input{font:inherit}
    .page{width:min(980px,calc(100% - 28px));margin:auto;padding:30px 0 46px}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
    .brand{display:flex;align-items:center;gap:14px}
    .logo{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--navy);color:white;font-size:28px;box-shadow:0 9px 20px rgba(21,59,104,.22)}
    .eyebrow{margin:0 0 2px;color:#147985;font-size:13px;font-weight:800;letter-spacing:.14em}
    h1{margin:0;font-size:clamp(26px,5vw,36px)}
    .print-btn,.reset-btn,.check-btn,.submit-score-btn{border:0;border-radius:11px;padding:11px 17px;font-weight:800;cursor:pointer}
    .print-btn,.reset-btn{border:1px solid #b9c9da;background:white;color:var(--navy)}
    .check-btn{background:#64d9cd;color:#123457}
    .submit-score-btn{background:#315cdb;color:white;box-shadow:0 7px 16px rgba(49,92,219,.24)}
    .submit-score-btn:disabled{cursor:not-allowed;opacity:.45}
    .student{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;padding:16px 18px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.85)}
    .field{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
    .field input{min-width:0;width:100%;padding:8px 10px;border:1px solid #c7d4e0;border-radius:9px;color:var(--ink);background:#fff}
    .progress-card{display:grid;grid-template-columns:150px 1fr 150px;align-items:center;gap:18px;padding:15px 19px;border:1px solid var(--line);border-radius:17px;background:white;box-shadow:0 8px 28px rgba(33,67,100,.07)}
    .progress-card strong{color:var(--navy)}
    .track{height:10px;overflow:hidden;border-radius:99px;background:#dce7f0}
    .bar{width:0;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),#5ed2c7);transition:width .25s}
    .progress-tip{text-align:right;color:var(--muted);font-size:13px}
    .notice{margin:20px 0;padding:13px 16px;border-left:4px solid var(--orange);border-radius:9px 14px 14px 9px;background:#fff6e7;color:#68450f;line-height:1.6}
    #worksheet{display:grid;gap:22px}
    .section{overflow:hidden;border:1px solid var(--line);border-radius:21px;background:white;box-shadow:0 11px 32px rgba(35,66,95,.08)}
    .section-head{display:flex;justify-content:space-between;gap:18px;padding:20px 23px 17px;border-bottom:1px solid #e3ebf2;background:linear-gradient(90deg,var(--soft),white 75%)}
    .section h2{margin:0 0 4px;color:var(--navy);font-size:21px}
    .section-head p{margin:0;color:var(--muted);font-size:14px}
    .section-head span{align-self:center;white-space:nowrap;padding:5px 9px;border-radius:99px;background:var(--chip);color:var(--tone);font-size:12px;font-weight:800}
    .cyan{--soft:#e5f7f9;--chip:#cceff3;--tone:#0f6872}
    .orange{--soft:#fff3df;--chip:#ffe4b8;--tone:#82500f}
    .violet{--soft:#f0edfb;--chip:#e2dcf7;--tone:#51408b}
    .green{--soft:#e7f7f0;--chip:#caeddc;--tone:#176044}
    .questions{padding:4px 23px}
    .question{padding:20px 0;border-bottom:1px dashed var(--line)}
    .question:last-child{border-bottom:0}
    .q-title{display:flex;align-items:flex-start;gap:11px;margin-bottom:13px;font-size:17px;font-weight:700;line-height:1.6}
    .num{display:grid;flex:none;place-items:center;width:30px;height:30px;border:2px solid var(--tone);border-radius:9px;color:var(--tone);font-size:13px;font-weight:900}
    .focus{padding:0 2px 1px;border-bottom:3px solid var(--tone);font-size:1.1em;font-weight:900}
    .choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-left:41px}
    .choice{display:flex;align-items:center;gap:10px;min-height:50px;padding:10px 13px;border:1.5px solid #d2dee8;border-radius:12px;background:#fbfdff;cursor:pointer;transition:.16s}
    .choice:hover{border-color:var(--tone);background:var(--soft);transform:translateY(-1px)}
    .choice:has(input:checked){border-color:var(--tone);background:var(--soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--tone) 14%,transparent)}
    .choice input{width:17px;height:17px;accent-color:var(--tone)}
    .letter{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:#edf2f7;color:#3f536a;font-size:12px;font-weight:850}
    .choice.correct{border-color:var(--green)!important;background:var(--green-soft)!important}
    .choice.wrong{border-color:var(--red)!important;background:var(--red-soft)!important}
    .feedback{display:none;margin:11px 0 0 41px;padding:10px 12px;border-radius:10px;font-size:14px;line-height:1.55}
    .feedback.show{display:block}
    .feedback.ok{color:#176044;background:var(--green-soft)}
    .feedback.no{color:#7e3030;background:var(--red-soft)}
    .submit{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:24px;padding:23px;border-radius:19px;background:var(--navy);color:white;box-shadow:0 13px 30px rgba(21,59,104,.2)}
    .submit h2{margin:0 0 4px;font-size:20px}.submit p{margin:0;color:#ccdae8}
    .submit-controls{display:grid;gap:8px;justify-items:end}.actions{display:flex;gap:10px}.reset-btn{border-color:#6c86a2;background:rgba(255,255,255,.06);color:white}
    .submit-status{min-height:20px;margin:0!important;color:#d7e5f1!important;font-size:13px;text-align:right}
    .submit-status.success{color:#8ff0d1!important}.submit-status.error{color:#ffd0d0!important}
    .score{display:none}.score.show{display:block}.score strong{color:#71e0d5;font-size:28px}.score small{color:#c7d8e7;font-size:15px}
    footer{display:flex;justify-content:space-between;margin-top:20px;color:#718398;font-size:12px}
    @media(max-width:680px){
      .page{width:min(100% - 18px,980px);padding-top:18px}.logo{width:46px;height:46px}.print-btn{width:44px;padding:11px 0;font-size:0}.print-btn::after{content:"🖨";font-size:18px}
      .student{grid-template-columns:1fr}.progress-card{grid-template-columns:1fr auto}.track{grid-column:1/-1;grid-row:2}.progress-tip{grid-column:2;grid-row:1}
      .section-head,.questions{padding-left:16px;padding-right:16px}.section-head span{display:none}.choices{grid-template-columns:1fr;margin-left:41px}.submit{align-items:stretch;flex-direction:column}.submit-controls{justify-items:stretch}.actions{display:grid;grid-template-columns:1fr 1fr}.submit-status{text-align:left}
    }
    @media print{
      @page{size:A4;margin:13mm}body{background:white}.page{width:100%;padding:0}.no-print{display:none!important}
      header{margin-bottom:10px}.logo{width:38px;height:38px;box-shadow:none}h1{font-size:22pt}.eyebrow{color:#333}
      .student{display:grid;padding:8px 0;border:0;border-radius:0;border-bottom:1px solid #555}.field input{border:0;border-bottom:1px solid #777;border-radius:0}
      .notice{margin:8px 0;padding:6px 8px;border:1px solid #777;background:white;color:#000;font-size:9pt}
      #worksheet{gap:9px}.section{break-inside:avoid;border:1px solid #777;border-radius:0;box-shadow:none}.section-head{padding:6px 9px;background:#eee}.section h2{margin:0;color:#000;font-size:12pt}.section-head p{font-size:8pt}.questions{display:grid;grid-template-columns:1fr 1fr;column-gap:14px;padding:2px 9px}
      .question{padding:6px 0;break-inside:avoid}.q-title{gap:6px;margin-bottom:4px;font-size:9pt}.num{width:20px;height:20px;border:1px solid #555;border-radius:4px;font-size:7pt}.focus{border-color:#000}
      .choices{display:flex;gap:10px;margin-left:26px}.choice{min-height:0;padding:0;border:0!important;background:white!important;box-shadow:none!important;font-size:8pt}.choice input{width:10px;height:10px}.letter{width:auto;height:auto;background:white;color:#000}.feedback{display:none!important}
      footer{margin-top:7px;color:#444}
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand"><div class="logo">学</div><div><p class="eyebrow">五年级华文</p><h1>多音多义字练习</h1></div></div>
      <button class="print-btn no-print" type="button" onclick="window.print()">打印练习</button>
    </header>

    <section class="student">
      <label class="field">姓名：<input id="studentName" type="text" autocomplete="name"></label>
      <label class="field">班级：<input id="studentClass" type="text"></label>
    </section>

    <section class="progress-card no-print">
      <div>作答进度：<strong id="answered">0 / 20</strong></div>
      <div class="track" aria-hidden="true"><div class="bar" id="bar"></div></div>
      <div class="progress-tip">完成后按“提交成绩”</div>
    </section>

    <div class="notice">认真读完整句子，再判断字的读音或意思。每题只有一个正确答案。</div>
    <div id="worksheet"></div>

    <section class="submit no-print">
      <div id="beforeCheck"><h2>完成后提交成绩</h2><p id="remaining">还有20题未作答。</p></div>
      <div id="score" class="score" aria-live="polite"><strong id="scoreNumber">0</strong><small> / 20分</small><p id="scoreComment"></p></div>
      <div class="submit-controls">
        <div class="actions">
          <button class="submit-score-btn" type="button" id="submitScoreBtn">提交成绩</button>
          <button class="reset-btn" type="button" id="resetBtn">重新作答</button>
        </div>
        <p class="submit-status" id="submitStatus" aria-live="polite">提交后会自动批改并发送给老师。</p>
      </div>
    </section>
    <footer><span>五年级华文 · 多音多义字</span><span>共20题 · 满分20分</span></footer>
  </main>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyq7lI4IVkOFVwAbiwZ3jFfArFTclQRo3WMy4ezx9YkIcNI5MOARvkJx3D7mmiX1InA6Q/exec";
    const EXERCISE_NAME = "五年级华文多音多义字练习";
    const sections = [
      {title:"一、选择正确读音",instruction:"选择句子中加点字的正确读音。",tone:"cyan",questions:[
        {id:1,prompt:"他{背}着书包走进教室。",options:["bēi","bèi","pēi"],answer:0,explain:"“背”表示用背驮东西时读 bēi。"},
        {id:2,prompt:"这本故事书我已经{看}过了。",options:["kān","kàn","kǎn"],answer:1,explain:"“看”表示阅读、观看时读 kàn。"},
        {id:3,prompt:"姐姐喜欢听古典音{乐}。",options:["lè","yuè","yào"],answer:1,explain:"“音乐”的“乐”读 yuè。"},
        {id:4,prompt:"爸爸到银{行}办理手续。",options:["xíng","háng","hàng"],answer:1,explain:"“银行”的“行”读 háng。"},
        {id:5,prompt:"妈妈把破了的衣服{缝}补好。",options:["féng","fèng","fēng"],answer:0,explain:"“缝补”的“缝”读 féng。"}
      ]},
      {title:"二、根据读音选择词义",instruction:"留意加点字的读音，选择最合适的意思。",tone:"orange",questions:[
        {id:6,prompt:"他十分{好}（hào）学，遇到问题总会追问。",options:["优点很多","喜爱","完成"],answer:1,explain:"“好学”中的“好”读 hào，表示喜爱。"},
        {id:7,prompt:"警方正在{调}（diào）查事情的经过。",options:["调动位置","考察并了解","配合得均匀"],answer:1,explain:"“调查”的“调”读 diào，表示考察、了解。"},
        {id:8,prompt:"请你{重}（chóng）新检查一次答案。",options:["分量大","重要","再一次"],answer:2,explain:"“重新”的“重”读 chóng，表示再一次。"},
        {id:9,prompt:"这家商店的文具很{便}（pián）宜。",options:["价钱低","方便","顺利"],answer:0,explain:"“便宜”的“便”读 pián，表示价钱低。"},
        {id:10,prompt:"妹妹剪了一头短{发}（fà）。",options:["送出","产生","头发、毛发"],answer:2,explain:"“头发”的“发”读 fà，表示毛发。"}
      ]},
      {title:"三、选字填空",instruction:"选择正确的字，完成句子。",tone:"violet",questions:[
        {id:11,prompt:"姐姐把丝带（　）在礼物盒上。",options:["系","寄","记"],answer:0,explain:"“系”在这里读 jì，意思是打结、扣上。"},
        {id:12,prompt:"工人用钉子把木板（　）牢。",options:["钉","盯","叮"],answer:0,explain:"“钉牢”的“钉”读 dìng。"},
        {id:13,prompt:"同学们排成整齐的一（　）。",options:["航","行","杭"],answer:1,explain:"量词“一行”的“行”读 háng。"},
        {id:14,prompt:"春天到了，花园里（　）开着各种鲜花。",options:["胜","剩","盛"],answer:2,explain:"“盛开”的“盛”读 shèng。"},
        {id:15,prompt:"他一转身，不小心（　）在地上。",options:["到","倒","导"],answer:1,explain:"“倒在地上”的“倒”读 dǎo。"}
      ]},
      {title:"四、句子辨义",instruction:"根据句子内容，判断加点字或词的意思。",tone:"green",questions:[
        {id:16,prompt:"爸爸今天没有{空}来参加活动。",options:["里面没有东西","天空","空闲的时间"],answer:2,explain:"“没有空”的“空”读 kòng，表示空闲时间。"},
        {id:17,prompt:"这口井很{深}，大家不要靠得太近。",options:["颜色浓","距离大","感情好"],answer:1,explain:"这里的“深”表示距离大。"},
        {id:18,prompt:"听到这个消息，他心里十分难{过}。",options:["经过","错误","“难过”表示伤心"],answer:2,explain:"“难过”在句中表示伤心。"},
        {id:19,prompt:"我们要节{省}用水，不要浪费。",options:["节约","行政区域","省略"],answer:0,explain:"“节省”的“省”表示节约。"},
        {id:20,prompt:"这条公路又宽又{直}。",options:["一直","不弯曲","公正"],answer:1,explain:"这里的“直”表示不弯曲。"}
      ]}
    ];

    const wrongReasons = {
      1:{1:"“背”读 bèi 时表示背部、背面或违背；句中表示用背驮书包，所以不能读 bèi。",2:"pēi 不是“背”的规范读音。"},
      2:{0:"kān 表示看守或照料，例如“看门”；句中表示阅读故事书，所以不能读 kān。",2:"kǎn 不是“看”的规范读音。"},
      3:{0:"lè 用在“快乐、乐意”等词中；句中的“音乐”指乐曲，应该读 yuè。",2:"yào 不是“乐”在这个词中的正确读音。"},
      4:{0:"xíng 表示行走、可以，例如“步行、行吗”；“银行”是营业机构，应该读 háng。",2:"hàng 不是“行”在“银行”中的规范读音。"},
      5:{1:"fèng 表示裂缝或缝隙，是名词；“缝补”表示用针线修补，是动作，应该读 féng。",2:"fēng 不是“缝补”的正确读音。"},
      6:{0:"“优点很多、很好”中的“好”读 hǎo；题目明确标出 hào，所以这里不是“优点很多”。",2:"“完成”不是“好”的词义，也不能解释“好学”。"},
      7:{0:"“调动”表示移动或安排人员；句中警方是在了解事情经过，并没有调动位置。",2:"“调匀、调节”的“调”读 tiáo，表示配合均匀，不符合“调查”的意思。"},
      8:{0:"表示分量大时，“重”读 zhòng；题目中的“重”读 chóng，所以不能选“分量大”。",1:"表示重要时，“重”读 zhòng；“重新”的 chóng 表示再一次。"},
      9:{1:"“方便”的“便”读 biàn；题目中的 pián 出现在“便宜”里，表示价钱低。",2:"“顺利”不是“便”在“便宜”这个词里的意思。"},
      10:{0:"表示送出、发出时，“发”读 fā；题目标出的 fà 表示头发。",1:"表示产生、发生时，“发”读 fā；句中说的是妹妹的头发。"},
      11:{1:"“寄”表示寄送，例如寄信；句子需要的是把丝带绑在盒子上。",2:"“记”表示记录或记住，不能表示把丝带绑起来。"},
      12:{1:"“盯”表示集中目光看，例如盯着；句中是用钉子固定木板。",2:"“叮”常用于声音或叮嘱，不表示用钉子固定。"},
      13:{0:"“航”表示在水上或空中行驶，例如航行，不能作队列的量词。",2:"“杭”常用于地名“杭州”，不能表示整齐的队列。"},
      14:{0:"“胜”表示胜利或超过；句中要表达花朵开放。",1:"“剩”表示余下；“剩开”不能组成正确词语。"},
      15:{0:"“到”表示到达；句中需要表达身体失去平衡而倒下。",2:"“导”表示引导或指导，不能表示摔在地上。"},
      16:{0:"表示里面没有东西时，“空”读 kōng；“没有空来”说的是没有空闲时间。",1:"“天空”的“空”读 kōng；句中不是指天空，而是指空闲时间。"},
      17:{0:"“深”可以形容颜色浓，但句子谈的是井的深度，不是颜色。",2:"“深”也可以形容感情深厚，但句中说的是井口到井底的距离。"},
      18:{0:"“经过”的“过”表示通过；“难过”在句中是一个完整词语，表示伤心。",1:"“错误”可以说“过错”，但句中没有谈犯错，而是在表达伤心。"},
      19:{1:"“省”可以指行政区域，例如柔佛州不是省；但“节省用水”说的是节约。",2:"“省略”表示删去部分内容；句中谈的是不要浪费用水。"},
      20:{0:"“一直”表示动作或状态持续；句中是在描写公路的形状。",2:"“正直、公正”通常形容人的品格；句中形容道路，所以应选“不弯曲”。"}
    };

    const answers = {};
    let latestScore = null;
    let submitting = false;
    const worksheet = document.getElementById("worksheet");
    const letters = ["A","B","C"];

    function formatPrompt(text){
      return text.replace(/\{([^}]+)\}/g,'<span class="focus">$1</span>');
    }

    function render(){
      worksheet.innerHTML = sections.map(section => `
        <section class="section ${section.tone}">
          <div class="section-head"><div><h2>${section.title}</h2><p>${section.instruction}</p></div><span>每题1分</span></div>
          <div class="questions">${section.questions.map(q => `
            <article class="question" id="q${q.id}">
              <div class="q-title"><span class="num">${q.id}</span><span>${formatPrompt(q.prompt)}</span></div>
              <div class="choices" role="radiogroup" aria-label="第${q.id}题">
                ${q.options.map((option,index)=>`<label class="choice" data-index="${index}"><input type="radio" name="q${q.id}" value="${index}"><span class="letter">${letters[index]}</span><span>${option}</span></label>`).join("")}
              </div>
              <div class="feedback" id="feedback${q.id}"></div>
            </article>`).join("")}
          </div>
        </section>`).join("");

      worksheet.querySelectorAll('input[type="radio"]').forEach(input => {
        input.addEventListener("change", event => {
          const id = Number(event.target.name.slice(1));
          answers[id] = Number(event.target.value);
          clearMarking(); updateProgress();
        });
      });
    }

    function updateProgress(){
      const count = Object.keys(answers).length;
      document.getElementById("answered").textContent = `${count} / 20`;
      document.getElementById("bar").style.width = `${count * 5}%`;
      document.getElementById("remaining").textContent = count === 20 ? "20题已完成，可以提交成绩了。" : `还有${20-count}题未作答。`;
    }

    function clearMarking(){
      document.querySelectorAll(".choice").forEach(el=>el.classList.remove("correct","wrong"));
      document.querySelectorAll(".feedback").forEach(el=>{el.className="feedback";el.textContent=""});
      document.getElementById("score").classList.remove("show");
      document.getElementById("beforeCheck").style.display="block";
      latestScore = null;
      const submitButton = document.getElementById("submitScoreBtn");
      submitButton.disabled = false;
      submitButton.textContent = "提交成绩";
      const status = document.getElementById("submitStatus");
      status.className = "submit-status";
      status.textContent = "提交后会自动批改并发送给老师。";
    }

    function checkAnswers(){
      let score = 0;
      sections.flatMap(s=>s.questions).forEach(q=>{
        const card = document.getElementById(`q${q.id}`);
        const choices = card.querySelectorAll(".choice");
        choices[q.answer].classList.add("correct");
        const selected = answers[q.id];
        const ok = selected === q.answer;
        if(ok) score++;
        else if(selected !== undefined) choices[selected].classList.add("wrong");
        const feedback = document.getElementById(`feedback${q.id}`);
        feedback.className = `feedback show ${ok ? "ok" : "no"}`;
        if(ok){
          feedback.textContent = `✓ 答对了！${q.explain}`;
        }else{
          const reason = selected === undefined
            ? "这一题没有作答，因此不能得分。"
            : wrongReasons[q.id][selected];
          const chosenText = selected === undefined
            ? "你没有选择答案。"
            : `你选择了“${q.options[selected]}”。`;
          feedback.textContent = `✗ ${chosenText}${reason} 正确答案：${letters[q.answer]} ${q.options[q.answer]}。${q.explain}`;
        }
      });
      document.getElementById("beforeCheck").style.display="none";
      document.getElementById("score").classList.add("show");
      document.getElementById("scoreNumber").textContent=score;
      document.getElementById("scoreComment").textContent=score===20?"太棒了，全部答对！":score>=16?"掌握得很好，再看看错题吧。":score>=12?"继续努力，把解释读一遍。":"先复习多音字，再挑战一次。";
      latestScore = score;
      return score;
    }

    async function submitScore(){
      if(submitting) return;
      const studentName = document.getElementById("studentName").value.trim();
      const studentClass = document.getElementById("studentClass").value.trim();
      if(!studentName){
        alert("请先填写学生姓名。");
        document.getElementById("studentName").focus();
        return;
      }

      checkAnswers();

      const submitButton = document.getElementById("submitScoreBtn");
      const status = document.getElementById("submitStatus");
      submitting = true;
      submitButton.disabled = true;
      submitButton.textContent = "提交中……";
      status.className = "submit-status";
      status.textContent = "正在把成绩发送给老师……";

      const displayName = studentClass ? `${studentClass}｜${studentName}` : studentName;
      try{
        await fetch(WEB_APP_URL,{
          method:"POST",
          mode:"no-cors",
          headers:{"Content-Type":"text/plain"},
          body:JSON.stringify({name:displayName,score:latestScore,total:20,exercise:EXERCISE_NAME})
        });
        submitButton.textContent = "成绩已提交";
        status.className = "submit-status success";
        status.textContent = `✓ ${studentName}的成绩已发送，请等待老师确认。`;
        document.getElementById("score").scrollIntoView({behavior:"smooth",block:"center"});
      }catch(error){
        submitButton.disabled = false;
        submitButton.textContent = "再次提交";
        status.className = "submit-status error";
        status.textContent = "提交失败，请检查网络后再试。";
      }finally{
        submitting = false;
      }
    }

    function resetAll(){
      Object.keys(answers).forEach(key=>delete answers[key]);
      document.querySelectorAll('input[type="radio"]').forEach(input=>input.checked=false);
      clearMarking();updateProgress();window.scrollTo({top:0,behavior:"smooth"});
    }

    document.getElementById("resetBtn").addEventListener("click",resetAll);
    document.getElementById("submitScoreBtn").addEventListener("click",submitScore);
    render();updateProgress();
  </script>
</body>
</html>
